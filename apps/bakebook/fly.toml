# Bakebook OpenAPI service. Public at bakebook.kaja.tools.
#   fly certs add bakebook.kaja.tools --app kaja-bakebook
app = "kaja-bakebook"
primary_region = "sjc"

[build]

[env]
  PUBLIC_BASE_URL = "https://bakebook.kaja.tools"

[http_service]
  internal_port = 41530
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
