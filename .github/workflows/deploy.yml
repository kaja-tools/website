name: deploy
# Deploys the Fly.io apps. Three entry points, one matrix:
#   - called by the "main" workflow after a push to main compiles cleanly
#   - run by hand from the Actions tab ("Run workflow"), for one app or all
#   - daily, so a new kajatools/kaja image ships without a commit here
#
# Requires a repository secret named FLY_API_TOKEN (`fly tokens create deploy`).
on:
  schedule:
    - cron: "0 15 * * *" # daily, 15:00 UTC
  workflow_call:
    inputs:
      app:
        description: "App to deploy, or 'all'"
        type: string
        default: all
    secrets:
      FLY_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      app:
        description: "App to deploy"
        required: true
        default: all
        type: choice
        options:
          - all
          - home
          - theatre
          - seating
          - quirks
          - kaja

permissions:
  contents: read

jobs:
  # Turns the "app" input into the deploy matrix, so the app list lives in
  # exactly one place and a manual run spawns only the jobs it needs.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Select apps
        id: plan
        env:
          # flyctl resolves --config relative to "dir". kaja bakes proto files
          # from sibling apps, so it builds from the repo root instead.
          APPS: |
            [
              { "name": "home",    "app": "kaja-home",    "dir": "apps/home",    "config": "" },
              { "name": "theatre", "app": "kaja-theatre", "dir": "apps/theatre", "config": "" },
              { "name": "seating", "app": "kaja-seating", "dir": "apps/seating", "config": "" },
              { "name": "quirks",  "app": "kaja-quirks",  "dir": "apps/quirks",  "config": "" },
              { "name": "kaja",    "app": "kaja-demo",    "dir": ".",            "config": "apps/kaja/fly.toml" }
            ]
          # A schedule run carries no inputs, so fall back to deploying all.
          SELECTED: ${{ inputs.app || 'all' }}
        run: |
          set -euo pipefail
          if [ "$SELECTED" = all ]; then
            include=$(jq -c . <<<"$APPS")
          else
            include=$(jq -c --arg name "$SELECTED" '[.[] | select(.name == $name)]' <<<"$APPS")
          fi
          if [ "$include" = "[]" ]; then
            echo "::error::Unknown app '$SELECTED'"
            exit 1
          fi
          names=$(jq -r '[.[].name] | join(", ")' <<<"$include")
          echo "Deploying $names from ${{ github.ref_name }}"
          echo "Deploying **$names** from \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    # Fly deploys of the same app must not overlap.
    concurrency: deploy-${{ matrix.name }}
    strategy:
      # Deploy every app, even if one fails, so a single flaky deploy doesn't
      # block the rest.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "::error::FLY_API_TOKEN secret is not set — create one with 'fly tokens create deploy'"
            exit 1
          fi
          status=0
          flyctl deploy ${{ matrix.dir }} ${{ matrix.config && format('--config {0}', matrix.config) || '' }} --remote-only || status=$?
          if [ "$status" -ne 0 ]; then
            # flyctl only reports "app not found", which reads like a bad config
            # rather than a Fly app nobody has created yet. Say which one.
            if ! flyctl status --app "${{ matrix.app }}" >/dev/null 2>&1; then
              echo "::error::Fly app '${{ matrix.app }}' does not exist — run scripts/fly-setup to create it and attach its hostname"
            fi
            exit "$status"
          fi
