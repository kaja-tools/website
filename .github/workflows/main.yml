name: main
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
jobs:
  # Single job (not a matrix) so the required status check context is exactly
  # "build" — a matrix would report as "build (theatre)" etc. and never satisfy
  # a rule requiring "build".
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build and vet
        run: |
          set -e
          for dir in apps/*/; do
            if [ -f "$dir/go.mod" ]; then
              echo "==> $dir"
              (cd "$dir" && go build ./... && go vet ./...)
            fi
          done
          # home has no go.mod: a stdlib-only program built straight from source.
          echo "==> apps/home"
          (cd apps/home && go build -o /dev/null cmd/server/main.go)

  deploy:
    name: Deploy ${{ matrix.name }}
    # Only deploy from main, and only once the code compiles.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    # Fly deploys of the same app must not overlap.
    concurrency: deploy-${{ matrix.name }}
    strategy:
      # Deploy every app, even if one fails, so a single flaky deploy doesn't
      # block the rest.
      fail-fast: false
      matrix:
        include:
          - { name: home, dir: apps/home }
          - { name: theatre, dir: apps/theatre }
          - { name: seating, dir: apps/seating }
          - { name: quirks, dir: apps/quirks }
          # flyctl resolves --config relative to the working directory (dir).
          # kaja bakes proto files from sibling apps, so it builds from the repo root.
          - { name: kaja, dir: ".", config: apps/kaja/fly.toml }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy ${{ matrix.dir }} ${{ matrix.config && format('--config {0}', matrix.config) || '' }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
