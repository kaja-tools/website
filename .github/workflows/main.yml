name: main
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

# Both jobs only read the repository. deploy.yml needs contents:read too, and a
# called workflow can never get more than its caller.
permissions:
  contents: read

jobs:
  # Single job (not a matrix) so the required status check context is exactly
  # "build" — a matrix would report as "build (theatre)" etc. and never satisfy
  # a rule requiring "build".
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Build and vet
        run: |
          set -e
          for dir in apps/*/; do
            if [ -f "$dir/go.mod" ]; then
              echo "==> $dir"
              (cd "$dir" && go build ./... && go vet ./...)
            fi
          done
          # home has no go.mod: a stdlib-only program built straight from source.
          echo "==> apps/home"
          (cd apps/home && go build -o /dev/null cmd/server/main.go)

  # Deploys every app. Same workflow the Actions tab runs by hand, so a push
  # deploy and a manual deploy are the same code path.
  deploy:
    # Only deploy from main, and only once the code compiles.
    if: github.event_name == 'push'
    needs: build
    uses: ./.github/workflows/deploy.yml
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
