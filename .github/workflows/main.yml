name: main
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

# Both jobs only read the repository. deploy.yml needs contents:read too, and a
# called workflow can never get more than its caller.
permissions:
  contents: read

jobs:
  # Single job (not a matrix) so the required status check context is exactly
  # "build" — a matrix would report as "build (theatre)" etc. and never satisfy
  # a rule requiring "build".
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # Every service is its own module under apps/, and there is no go.mod
          # at the repository root — so setup-go's default lookup finds nothing
          # and silently caches nothing. Point it at the modules that exist, or
          # every run re-downloads the dependencies and recompiles from cold.
          cache-dependency-path: |
            apps/*/go.mod
            apps/*/go.sum
      - name: Build, vet and test the services
        run: |
          set -e
          for dir in apps/*/; do
            if [ -f "$dir/go.mod" ]; then
              echo "==> $dir"
              (cd "$dir" && go build ./... && go vet ./... && go test ./...)
            fi
          done
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: home/package-lock.json
      # The website is Astro, not Go, so it gets the checks its own toolchain
      # offers: types, formatting, and a build that has to actually succeed.
      - name: Build and check the website
        working-directory: home
        run: |
          npm ci --prefer-offline --no-audit --fund=false
          npm run format:check
          npm run check
          npm run build

  # Deploys every app. Same workflow the Actions tab runs by hand, so a push
  # deploy and a manual deploy are the same code path.
  deploy:
    # Only deploy from main, and only once the code compiles.
    if: github.event_name == 'push'
    needs: build
    uses: ./.github/workflows/deploy.yml
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
